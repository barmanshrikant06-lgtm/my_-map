<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Chhatwai Village Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111827;
}

header {
    background: #101c35;
    color: white;
    padding: 15px;
    text-align: center;
}

header h2 {
    font-size: 23px;
}

header p {
    color: #a5c5ff;
    margin-top: 5px;
}

.search {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #17243c;
}

input, button, select {
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
}

input {
    flex: 1;
    min-width: 0;
}

button {
    background: #1685ff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0065d5;
}

.controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #17243c;
    flex-wrap: wrap;
}

.controls button {
    flex: 1;
    min-width: 100px;
}

#map {
    width: 100%;
    height: calc(100vh - 205px);
    min-height: 400px;
}

.info {
    background: #101c35;
    color: white;
    padding: 12px;
    text-align: center;
    font-size: 13px;
}

.leaflet-popup-content-wrapper {
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h2>🌍 BIG CHHATWAI MAP</h2>
    <p>Explore Every Road • Every Village • Every Place</p>
</header>

<div class="search">
    <input id="searchBox" type="text"
    placeholder="Search village or place...">
    <button onclick="searchPlace()">Search</button>
</div>

<div class="controls">
    <button onclick="myLocation()">📍 My Location</button>
    <button onclick="showAll()">🌍 Full Map</button>
    <button onclick="clearRoute()">❌ Clear Route</button>
</div>

<div id="map"></div>

<div class="info">
    🗺️ Explore Big Chhatwai | Map data © OpenStreetMap
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// IMPORTANT:
// Replace these sample coordinates with the exact
// coordinates of Big Chhatwai after confirming its location.

const villageLat = 22.0;
const villageLng = 79.0;

const map = L.map('map').setView(
    [villageLat, villageLng], 13
);

// OpenStreetMap live map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

let routeLayer = null;
let markers = [];

const mainMarker = L.marker([
    villageLat, villageLng
]).addTo(map);

mainMarker.bindPopup(
    "<b>BIG CHHATWAI</b><br>Village Map"
);

function searchPlace() {

    const query = document.getElementById("searchBox").value.trim();

    if (!query) {
        alert("Please enter a place name!");
        return;
    }

    fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(query + ", India")
    )
    .then(response => response.json())
    .then(data => {

        if (data.length === 0) {
            alert("Place not found!");
            return;
        }

        const place = data[0];

        const lat = Number(place.lat);
        const lon = Number(place.lon);

        map.setView([lat, lon], 16);

        const marker = L.marker([lat, lon]).addTo(map);

        marker.bindPopup(
            "<b>" + place.display_name + "</b>"
        ).openPopup();

        markers.push(marker);
    })
    .catch(() => alert("Search failed. Check internet connection."));
}

// User current location
function myLocation() {

    if (!navigator.geolocation) {
        alert("Location not supported!");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            map.setView([lat, lon], 17);

            L.marker([lat, lon])
                .addTo(map)
                .bindPopup("📍 Your Current Location")
                .openPopup();

        },
        () => alert("Please allow location permission!")
    );
}

// Show full map
function showAll() {
    map.setView([villageLat, villageLng], 13);
}

// Clear route
function clearRoute() {

    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }

    alert("Route cleared!");
}

// Click on map to explore locations
map.on('click', function(e) {

    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    const marker = L.marker([lat, lon]).addTo(map);

    marker.bindPopup(`
        <b>Selected Location</b><br>
        Latitude: ${lat.toFixed(5)}<br>
        Longitude: ${lon.toFixed(5)}<br>
        <button onclick="getRoute(${lat},${lon})">
        🚗 Get Route
        </button>
    `).openPopup();

    markers.push(marker);
});

// Get road route using OSRM
function getRoute(lat, lon) {

    if (!navigator.geolocation) {
        alert("Location not supported!");
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {

        const startLat = position.coords.latitude;
        const startLon = position.coords.longitude;

        const url =
        `https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${lon},${lat}?overview=full&geometries=geojson`;

        fetch(url)
        .then(res => res.json())
        .then(data => {

            if (!data.routes || !data.routes.length) {
                alert("Route not found!");
                return;
            }

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            routeLayer = L.geoJSON(
                data.routes[0].geometry,
                {
                    style: {
                        color: "#006eff",
                        weight: 6
                    }
                }
            ).addTo(map);

            map.fitBounds(routeLayer.getBounds());

            const km = (
                data.routes[0].distance / 1000
            ).toFixed(2);

            alert("Distance: " + km + " KM");

        })
        .catch(() => alert("Route service unavailable!"));

    }, () => alert("Allow location permission first!"));
}

</script>

</body>
</html>
