
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Chhatwai Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

header {
  background: #075985;
  color: white;
  padding: 16px;
  text-align: center;
}

header h2 {
  font-size: 23px;
}

header p {
  margin-top: 5px;
}

.controls {
  padding: 12px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  padding: 11px 15px;
  border: none;
  border-radius: 7px;
  background: #0284c7;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

#map {
  width: 100%;
  height: 75vh;
  min-height: 400px;
}

footer {
  padding: 12px;
  text-align: center;
  color: #334155;
}
</style>
</head>

<body>

<header>
  <h2>🗺️ Big Chhatwai Map</h2>
  <p>बिग छतवई, जिला शहडोल, मध्य प्रदेश</p>
</header>

<div class="controls">
  <button onclick="showVillage()">📍 Big Chhatwai</button>
  <button onclick="roadMap()">🛣️ Road Map</button>
  <button onclick="satelliteMap()">🛰️ Satellite</button>
  <button onclick="directions()">🚗 Directions</button>
</div>

<div id="map"></div>

<footer>
  Big Chhatwai - Shahdol, Madhya Pradesh
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Approximate starting view; verify the exact village location
// before using this as a navigation map.
const map = L.map('map').setView([23.30, 81.36], 11);

let roadLayer;

function roadMap() {
  if (roadLayer) map.removeLayer(roadLayer);

  roadLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19 }
  ).addTo(map);
}

function satelliteMap() {
  if (roadLayer) map.removeLayer(roadLayer);

  roadLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19 }
  ).addTo(map);
}

function showVillage() {
  map.setView([23.30, 81.36], 14);
}

function directions() {
  window.open(
    'https://www.google.com/maps/dir/?api=1&destination=Big+Chhatwai,+Shahdol,+Madhya+Pradesh',
    '_blank'
  );
}

roadMap();

L.marker([23.30, 81.36])
  .addTo(map)
  .bindPopup('<b>Big Chhatwai</b><br>Shahdol, Madhya Pradesh')
  .openPopup();

</script>

</body>
</html>
