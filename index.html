
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Chhatwai Road Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 background:#f1f5f9;
}

header{
 background:#14532d;
 color:white;
 text-align:center;
 padding:16px 8px;
}

header h2{font-size:23px}
header p{font-size:13px;margin-top:6px}

.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:10px;
 background:white;
}

button{
 padding:11px 13px;
 border:0;
 border-radius:7px;
 background:#15803d;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button.blue{background:#2563eb}
button.orange{background:#ea580c}

#map{
 width:100%;
 height:75vh;
 min-height:450px;
}

#status{
 background:white;
 padding:12px;
 font-size:14px;
 color:#333;
}

.legend{
 background:white;
 padding:12px;
 display:flex;
 flex-wrap:wrap;
 gap:12px;
 font-size:12px;
}

.line{
 display:inline-block;
 width:22px;
 height:4px;
 margin-right:5px;
 vertical-align:middle;
}

footer{
 background:#14532d;
 color:white;
 text-align:center;
 padding:12px;
 font-size:12px;
}
</style>
</head>

<body>

<header>
 <h2>🗺️ CHHATWAI FULL ROAD MAP</h2>
 <p>पूरा छतवई गांव • सभी उपलब्ध सड़कें • गलियां</p>
</header>

<div class="toolbar">
 <button onclick="goHome()">🏠 छतवई</button>
 <button class="blue" onclick="loadRoads()">🛣️ सभी सड़कें लोड करें</button>
 <button class="blue" onclick="map.zoomIn()">＋ Zoom</button>
 <button class="blue" onclick="map.zoomOut()">－ Zoom</button>
 <button class="orange" onclick="myLocation()">📍 मेरी लोकेशन</button>
</div>

<div class="legend">
 <span><i class="line" style="background:red"></i>मुख्य सड़क</span>
 <span><i class="line" style="background:#2563eb"></i>अन्य सड़क</span>
 <span><i class="line" style="background:#eab308"></i>गली</span>
 <span><i class="line" style="background:#16a34a"></i>कच्चा रास्ता</span>
 <span><i class="line" style="background:#9333ea"></i>पगडंडी</span>
</div>

<div id="map"></div>

<div id="status">
 छतवई का मैप तैयार हो रहा है...
</div>

<footer>
 © OpenStreetMap Contributors | Road Map
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// CHHATWAI LOCATION
const HOME = [23.3923,81.3542];

// Map
const map = L.map('map').setView(HOME,15);

// Map background
L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  maxZoom:20,
  attribution:'© OpenStreetMap'
 }
).addTo(map);

// Village marker
L.marker(HOME)
 .addTo(map)
 .bindPopup('<b>छतवई गांव</b><br>शहडोल, मध्य प्रदेश')
 .openPopup();

// Road layer
let roadLayer = L.layerGroup().addTo(map);

// Status
function status(message){
 document.getElementById('status').innerText=message;
}

// Road colors
function roadStyle(type){

 if(type==='motorway' || type==='trunk' ||
    type==='primary' || type==='secondary'){
  return {color:'red',weight:5};
 }

 if(type==='tertiary' || type==='unclassified'){
  return {color:'#2563eb',weight:4};
 }

 if(type==='residential' || type==='living_street' ||
    type==='service'){
  return {color:'#eab308',weight:3};
 }

 if(type==='track'){
  return {color:'#16a34a',weight:3,dashArray:'6,5'};
 }

 if(type==='path' || type==='footway' ||
    type==='bridleway' || type==='steps'){
  return {color:'#9333ea',weight:2,dashArray:'4,5'};
 }

 return {color:'#64748b',weight:2};
}

// Load all available roads from OpenStreetMap
async function loadRoads(){

 status('सड़कें डाउनलोड हो रही हैं... कृपया इंतजार करें।');

 roadLayer.clearLayers();

 // Approximate area around Chhatwai.
 // South, West, North, East
 const bbox='23.35,81.31,23.43,81.40';

 const query=`
 [out:json][timeout:60];
 (
   way["highway"](${bbox});
 );
 out body geom;
 `;

 const servers=[
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
 ];

 let data=null;

 for(const server of servers){

  try{
   const response=await fetch(server,{
    method:'POST',
    body:'data='+encodeURIComponent(query)
   });

   if(!response.ok) continue;

   const result=await response.json();

   if(result.elements){
    data=result;
    break;
   }

  }catch(error){
   console.log('Server unavailable:',server);
  }
 }

 if(!data){
  status('सड़क डेटा लोड नहीं हुआ। इंटरनेट चेक करके फिर कोशिश करें।');
  return;
 }

 let count=0;

 data.elements.forEach(road=>{

  if(!road.geometry || road.geometry.length<2) return;

  const coordinates=road.geometry.map(point=>[
   point.lat,point.lon
  ]);

  const type=road.tags?.highway || 'road';
  const name=road.tags?.name || road.tags?.ref || 'बिना नाम का रास्ता';

  const line=L.polyline(
   coordinates,
   roadStyle(type)
  );

  line.bindPopup(
   '<b>'+name+'</b><br>'+
   'रास्ते का प्रकार: '+type
  );

  line.addTo(roadLayer);
  count++;

 });

 status(
  'सड़क डेटा लोड हो गया! कुल '+count+
  ' सड़क/रास्ते मिले। मैप पर Zoom करके देखें।'
 );

}

// Home
function goHome(){
 map.setView(HOME,16);
}

// Current location
function myLocation(){

 if(!navigator.geolocation){
  alert('लोकेशन उपलब्ध नहीं है');
  return;
 }

 navigator.geolocation.getCurrentPosition(
  function(position){

   const point=[
    position.coords.latitude,
    position.coords.longitude
   ];

   map.setView(point,18);

   L.marker(point)
    .addTo(map)
    .bindPopup('आपकी लोकेशन')
    .openPopup();

  },
  function(){
   alert('लोकेशन की अनुमति दें।');
  }
 );

}

// Load roads automatically
loadRoads();

</script>
</body>
</html>
