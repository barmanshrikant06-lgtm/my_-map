
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Chhatwai Village Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 background:#eef2f7;
}

header{
 background:#087bdb;
 color:white;
 padding:16px;
 text-align:center;
}

header h2{font-size:23px}
header p{font-size:13px;margin-top:5px}

.panel{
 background:white;
 padding:14px;
 box-shadow:0 2px 8px #0002;
}

input{
 width:100%;
 padding:13px;
 margin:5px 0;
 border:1px solid #bbb;
 border-radius:7px;
 font-size:15px;
}

button{
 border:0;
 border-radius:7px;
 padding:12px;
 margin:4px 2px;
 background:#087bdb;
 color:white;
 font-size:14px;
 cursor:pointer;
}

button:hover{background:#005ca8}

.green{background:#159447}
.orange{background:#ed8c16}

#map{
 height:65vh;
 min-height:380px;
 width:100%;
}

#status{
 padding:10px;
 font-size:14px;
 color:#333;
}

#results{
 max-height:160px;
 overflow:auto;
}

.result{
 background:#f1f5f9;
 padding:10px;
 margin:5px 0;
 border-radius:6px;
 cursor:pointer;
 font-size:13px;
}

footer{
 text-align:center;
 padding:12px;
 font-size:12px;
 color:#666;
}
</style>
</head>

<body>

<header>
<h2>🗺️ BIG CHHATWAI MAP</h2>
<p>Village Explorer | Big Chhatwai to Jarwahi</p>
</header>

<div class="panel">

<input id="from" value="Big Chhatwai, India"
placeholder="Starting location">

<input id="to" value="Jarwahi, India"
placeholder="Destination location">

<button onclick="findRoute()">🛣️ रास्ता दिखाओ</button>
<button class="green" onclick="myLocation()">📍 मेरी Location</button>
<button class="orange" onclick="clearRoute()">Clear Route</button>

<input id="search" placeholder="🔍 गाँव या जगह खोजें">

<button onclick="searchPlace()">Search Place</button>

<div id="results"></div>

</div>

<div id="status">
मैप लोड हो रहा है...
</div>

<div id="map"></div>

<footer>
Powered by OpenStreetMap | Leaflet
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP SETUP
const map = L.map('map').setView([22.5, 82.0], 6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 maxZoom:19,
 attribution:'© OpenStreetMap contributors'
}
).addTo(map);

let routeLayer = null;
let markers = [];
let startPoint = null;
let endPoint = null;

// LOCATION SEARCH
async function geocode(place){

 const url =
 'https://nominatim.openstreetmap.org/search?format=jsonv2&q='
 + encodeURIComponent(place)
 + '&countrycodes=in&limit=5';

 const response = await fetch(url);
 if(!response.ok) throw new Error("Location search failed");

 return await response.json();
}

// DISPLAY SEARCH RESULTS
async function selectLocation(place, callback){

 document.getElementById('status').innerText =
 'Searching: '+place;

 try{
  const results = await geocode(place);

  if(results.length===0){
   alert("Location नहीं मिली। District और State के साथ खोजें।");
   return;
  }

  const box = document.getElementById('results');
  box.innerHTML = "<b>अपनी सही Location चुनें:</b>";

  results.forEach(item=>{

   const div=document.createElement('div');
   div.className='result';
   div.textContent=item.display_name;

   div.onclick=()=>{

    const point=[
     Number(item.lat),
     Number(item.lon)
    ];

    callback(point,item.display_name);

    map.setView(point,15);

    box.innerHTML="Selected: "+item.display_name;
   };

   box.appendChild(div);
  });

  document.getElementById('status').innerText =
  "Location चुनें।";

 }catch(error){
  alert("Internet या location search में समस्या हुई।");
 }
}

// ROUTE FINDER
async function findRoute(){

 const from=document.getElementById('from').value.trim();
 const to=document.getElementById('to').value.trim();

 if(!from || !to){
  alert("Starting और Destination दोनों भरें");
  return;
 }

 document.getElementById('status').innerText =
 "Searching locations...";

 try{

  const a=await geocode(from);
  const b=await geocode(to);

  if(!a.length || !b.length){
   alert("गाँव नहीं मिला। District और State जोड़कर खोजें।");
   return;
  }

  // If more than one match exists, use first result.
  // Verify the selected place before proceeding.
  startPoint=[
   Number(a[0].lat),
   Number(a[0].lon)
  ];

  endPoint=[
   Number(b[0].lat),
   Number(b[0].lon)
  ];

  if(!confirm(
   "From: "+a[0].display_name+
   "\nTo: "+b[0].display_name+
   "\n\nक्या ये सही जगहें हैं?"
  )){
   document.getElementById('status').innerText =
   "जगह की जानकारी बदलें और दोबारा खोजें।";
   return;
  }

  showRoute();

 }catch(error){
  document.getElementById('status').innerText =
  "Location खोजने में समस्या हुई।";
 }
}

// DRAW ROUTE
async function showRoute(){

 if(!startPoint || !endPoint) return;

 document.getElementById('status').innerText =
 "सड़क का रास्ता बनाया जा रहा है...";

 const url=
 'https://router.project-osrm.org/route/v1/driving/'
 +startPoint[1]+','+startPoint[0]+';'
 +endPoint[1]+','+endPoint[0]
 +'?overview=full&geometries=geojson';

 try{

  const response=await fetch(url);
  const data=await response.json();

  if(data.code!=="Ok" || !data.routes.length){
   throw new Error("Route not found");
  }

  if(routeLayer) map.removeLayer(routeLayer);

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  const route=data.routes[0];

  routeLayer=L.geoJSON(route.geometry,{
   style:{
    color:'#087bdb',
    weight:6,
    opacity:0.85
   }
  }).addTo(map);

  markers.push(
   L.marker(startPoint).addTo(map)
   .bindPopup("🚩 Starting Location").openPopup()
  );

  markers.push(
   L.marker(endPoint).addTo(map)
   .bindPopup("🏁 Destination")
  );

  map.fitBounds(routeLayer.getBounds(),{
   padding:[35,35]
  });

  const km=(route.distance/1000).toFixed(2);
  const minutes=Math.round(route.duration/60);

  document.getElementById('status').innerHTML=
   "✅ रास्ता मिल गया!<br>"+
   "📏 दूरी: "+km+" KM<br>"+
   "⏱️ अनुमानित समय: "+minutes+" मिनट";

 }catch(error){

  document.getElementById('status').innerText=
  "रास्ता नहीं मिला। इस क्षेत्र की सड़कें routing data में उपलब्ध नहीं हो सकतीं।";

 }
}

// SEARCH ANY PLACE
function searchPlace(){

 const place=document.getElementById('search').value.trim();

 if(!place){
  alert("जगह का नाम लिखें");
  return;
 }

 selectLocation(place,(point,name)=>{

  L.marker(point).addTo(map)
   .bindPopup(name).openPopup();

 });
}

// GPS LOCATION
function myLocation(){

 if(!navigator.geolocation){
  alert("GPS उपलब्ध नहीं है");
  return;
 }

 navigator.geolocation.getCurrentPosition(position=>{

  const point=[
   position.coords.latitude,
   position.coords.longitude
  ];

  map.setView(point,16);

  L.marker(point).addTo(map)
   .bindPopup("📍 आपकी Location")
   .openPopup();

  document.getElementById('from').value=
   point[0]+","+point[1];

  document.getElementById('status').innerText=
   "आपकी Location मिल गई!";

 },()=>{
  alert("Location Permission दें और HTTPS पर वेबसाइट खोलें।");
 });
}

// CLEAR ROUTE
function clearRoute(){

 if(routeLayer){
  map.removeLayer(routeLayer);
  routeLayer=null;
 }

 markers.forEach(m=>map.removeLayer(m));
 markers=[];

 startPoint=null;
 endPoint=null;

 document.getElementById('status').innerText=
 "Map साफ कर दिया गया।";
}

</script>

</body>
</html>
