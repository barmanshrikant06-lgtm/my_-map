
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Chhatwai Village Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
}

header {
  background: #166534;
  color: white;
  padding: 17px;
  text-align: center;
}

header h2 {
  font-size: 23px;
}

header p {
  font-size: 13px;
  margin-top: 6px;
}

.search {
  display: flex;
  gap: 7px;
  padding: 12px;
  background: white;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 11px 14px;
  color: white;
  background: #15803d;
  cursor: pointer;
  font-size: 14px;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px;
  background: white;
}

.controls button {
  background: #2563eb;
}

#map {
  height: 72vh;
  min-height: 420px;
  width: 100%;
}

.info {
  padding: 12px;
  background: white;
  font-size: 14px;
  color: #333;
}

footer {
  padding: 12px;
  text-align: center;
  background: #166534;
  color: white;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h2>🗺️ BIG CHHATWAI MAP</h2>
  <p>Big Chhatwai • Chhatwai • आसपास के गाँव</p>
</header>

<div class="search">
  <input id="place"
  type="text"
  placeholder="गाँव, सड़क या जगह खोजें...">
  <button onclick="searchPlace()">खोजें</button>
</div>

<div class="controls">
  <button onclick="goHome()">🏠 Chhatwai</button>
  <button onclick="searchNamed('Badi Chhatwai, Shahdol, Madhya Pradesh')">Big Chhatwai</button>
  <button onclick="searchNamed('Jarwahi, Shahdol, Madhya Pradesh')">Jarwahi</button>
  <button onclick="myLocation()">📍 मेरी लोकेशन</button>
  <button onclick="map.zoomIn()">＋ Zoom</button>
  <button onclick="map.zoomOut()">－ Zoom</button>
</div>

<div id="map"></div>

<div class="info" id="status">
  मैप लोड हो रहा है...
</div>

<footer>
  Map Data © OpenStreetMap Contributors
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Map starting position: Shahdol region
const map = L.map('map').setView([23.30, 81.36], 12);

// OpenStreetMap roads and places
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

let marker;

// Search a place using OpenStreetMap
async function searchNamed(query) {

  document.getElementById('status').innerText =
    'जगह खोजी जा रही है...';

  try {
    const url =
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
      + encodeURIComponent(query);

    const response = await fetch(url);
    const data = await response.json();

    if (!data.length) {
      document.getElementById('status').innerText =
        'जगह नहीं मिली। दूसरा नाम लिखकर खोजें।';
      return;
    }

    const lat = Number(data[0].lat);
    const lon = Number(data[0].lon);

    map.setView([lat, lon], 16);

    if (marker) map.removeLayer(marker);

    marker = L.marker([lat, lon])
      .addTo(map)
      .bindPopup(data[0].display_name)
      .openPopup();

    document.getElementById('status').innerText =
      'मिली हुई जगह: ' + data[0].display_name;

  } catch(error) {
    document.getElementById('status').innerText =
      'इंटरनेट कनेक्शन चेक करें।';
  }
}

// Search button
function searchPlace() {
  const value = document.getElementById('place').value.trim();

  if (!value) {
    alert('पहले जगह का नाम लिखें');
    return;
  }

  searchNamed(value + ', Madhya Pradesh, India');
}

// Home button
function goHome() {
  searchNamed('Chhatwai, Sohagpur, Shahdol, Madhya Pradesh, India');
}

// My location
function myLocation() {

  if (!navigator.geolocation) {
    alert('आपके ब्राउजर में लोकेशन उपलब्ध नहीं है');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      map.setView([lat, lon], 17);

      if (marker) map.removeLayer(marker);

      marker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup('आपकी लोकेशन')
        .openPopup();

      document.getElementById('status').innerText =
        'आपकी लोकेशन दिखाई जा रही है';

    },
    function() {
      alert('लोकेशन की अनुमति दें।');
    }
  );
}

// Enter key search
document.getElementById('place')
.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchPlace();
});

// Automatically find Chhatwai on opening
searchNamed('Chhatwai, Sohagpur, Shahdol, Madhya Pradesh, India');

</script>

</body>
</html>
